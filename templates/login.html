{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
<section class="bloco caixa-estreita">
  <h1>Entrar</h1>
  <form method="post" class="formulario-coluna">
    {# Guarda para onde voltar depois do login (a página que a pessoa tentou abrir) #}
    <input type="hidden" name="proximo" value="{{ proximo }}">
    <label>Login
      <input name="login" autocomplete="username" autocapitalize="none" required autofocus>
    </label>
    <label>Senha
      <input name="senha" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Entrar</button>
  </form>
  <p class="dica">Esqueceu a senha? Peça para um administrador definir uma nova.</p>
</section>
{% endblock %}
